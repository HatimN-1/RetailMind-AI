[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "retailmind-ai"
version = "0.3.0"
description = "Reproducible retail analytics, anomaly detection and governed AI investigation platform"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
  "pandas>=2.1,<3.0", "numpy>=1.26,<3.0", "scikit-learn>=1.4,<2.0", "joblib>=1.3,<2.0",
  "fastapi>=0.110,<1.0", "uvicorn[standard]>=0.28,<1.0", "pydantic>=2.6,<3.0",
  "python-dotenv>=1.0,<2.0"
]
[project.optional-dependencies]
spark = ["pyspark>=3.5,<4.1", "pyarrow>=15,<25"]
analytics = ["duckdb>=1.1,<2.0", "dbt-duckdb>=1.8,<2.0"]
deep = ["torch>=2.2,<3.0"]
rag = ["qdrant-client>=1.12,<2.0", "sentence-transformers>=3.0,<6.0"]
agent = ["langgraph>=0.2,<2.0", "requests>=2.31,<3.0"]
dev = ["pytest>=8,<10", "httpx>=0.27,<1.0", "ruff>=0.8,<1.0"]
e2e = ["playwright>=1.50,<2.0"]
benchmark = ["matplotlib>=3.8,<4.0"]
[project.scripts]
retailmind = "retailmind.cli:main"
[tool.setuptools.packages.find]
where = ["src"]
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["integration: opt-in real cached embedding model and persistent Qdrant index"]
[tool.ruff]
line-length = 110
