# Optional Azure DevOps pipeline. No Azure resources are provisioned.
trigger:
  - main
pool:
  vmImage: 'ubuntu-latest'
steps:
  - task: UsePythonVersion@0
    inputs:
      versionSpec: '3.11'
  - script: |
      python -m pip install --upgrade pip
      python -m pip install -e '.[dev]'
      python -m compileall -q src tests
      python -m retailmind.bootstrap --rows 800
      python -m pytest -q
    displayName: 'Build local synthetic pipeline and run tests'
