name: RetailMind quality gates
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev,agent]' 'qdrant-client>=1.12,<2.0'
      - run: python -m compileall -q src tests
      - run: python -m ruff check src tests --select E4,E7,E9,F
      - run: python -m retailmind.bootstrap --rows 800
      - run: python -m pytest -q
      - run: python -m retailmind.cli investigate 'TX-0000001'
      - run: python -m retailmind.cli investigate 'Erreur de schéma Spark' --langgraph
